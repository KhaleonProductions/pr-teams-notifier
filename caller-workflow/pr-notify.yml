# Copy this file into your repo's .github/workflows/ directory.
# Add these repository secrets on GitHub:
#
#   Bot Framework path (recommended — direct channel post, no webhook):
#     - TEAMS_APP_ID                   (bot Entra appId)
#     - TEAMS_APP_PASSWORD             (bot client secret)
#     - TARGET_TEAM_ID                 (groupId of target team)
#     - TARGET_CHANNEL_ID              (channel id, format `19:....@thread.tacv2`)
#     - BOT_HOME_AZURE_TENANT_ID       (where the bot is registered)
#
#   Auto-doc Lists row + AI summary:
#     - CLAUDE_OAUTH_CREDS             (JSON from ~/.claude/.credentials.json)
#     - AZURE_TENANT_ID
#     - AZURE_CONTENT_CLIENT_ID
#     - AZURE_CONTENT_CLIENT_SECRET
#     - LISTS_SITE_ID
#     - LISTS_LIST_ID
#
#   Legacy fallback (only if you can't / won't use Bot Framework):
#     - TEAMS_WEBHOOK_URL
#
# All auto-doc secrets are optional — leave any unset to fall back gracefully.
# See: https://github.com/KhaleonProductions/pr-teams-notifier

name: PR Teams Notification

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: read
  contents: read

jobs:
  notify:
    uses: KhaleonProductions/pr-teams-notifier/.github/workflows/reusable-pr-notify.yml@master
    secrets:
      TEAMS_WEBHOOK_URL:           ${{ secrets.TEAMS_WEBHOOK_URL }}
      CLAUDE_OAUTH_CREDS:          ${{ secrets.CLAUDE_OAUTH_CREDS }}
      AZURE_TENANT_ID:             ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CONTENT_CLIENT_ID:     ${{ secrets.AZURE_CONTENT_CLIENT_ID }}
      AZURE_CONTENT_CLIENT_SECRET: ${{ secrets.AZURE_CONTENT_CLIENT_SECRET }}
      LISTS_SITE_ID:               ${{ secrets.LISTS_SITE_ID }}
      LISTS_LIST_ID:               ${{ secrets.LISTS_LIST_ID }}
      TEAMS_APP_ID:                ${{ secrets.TEAMS_APP_ID }}
      TEAMS_APP_PASSWORD:          ${{ secrets.TEAMS_APP_PASSWORD }}
      TARGET_TEAM_ID:              ${{ secrets.TARGET_TEAM_ID }}
      TARGET_CHANNEL_ID:           ${{ secrets.TARGET_CHANNEL_ID }}
      BOT_HOME_AZURE_TENANT_ID:    ${{ secrets.BOT_HOME_AZURE_TENANT_ID }}
